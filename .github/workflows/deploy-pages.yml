# Publishes the site to GitHub Pages every time you push to the main branch.
# The site is plain HTML, CSS and JS, so it's uploaded exactly as it is: no
# build step. To use it: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

# The permissions publishing needs. Their absence is what caused
# "Ensure GITHUB_TOKEN has permission id-token: write".
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels one still running, so the
# latest version always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the site files
        uses: actions/checkout@v5

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
