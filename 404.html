<!-- ============ 404: the home page's line, the other way round. There the
     tangle straightens into a path; here a straight path loses its way and
     knots up where the page should be, while a dashed line shows the route
     it should have taken. GitHub Pages shows this page for any address that
     doesn't exist. ============ -->
<main class="nf" id="main">
  <div class="nf-trail" aria-hidden="true">
    <div class="nf-stage">
      <svg class="nf-svg" viewBox="0 0 1000 220">
        <path class="nf-ghost" d="M8 128 L 960 128" />
        <path class="nf-line" id="nfPath" pathLength="1" d="M8 128 L 520 128 C 590 128, 620 70, 680 66 C 750 62, 760 168, 700 170 C 640 172, 640 54, 730 40 C 812 28, 860 128, 800 156 C 752 178, 722 112, 780 98 C 826 88, 850 126, 870 128" />
        <circle class="nf-node" cx="200" cy="128" r="6" />
        <circle class="nf-node" cx="380" cy="128" r="6" />
        <circle class="nf-dot" r="7" cx="0" cy="0">
          <animateMotion dur="2.6s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keyPoints="0;1" keySplines="0.55 0 0.2 1"><mpath href="#nfPath" xlink:href="#nfPath" /></animateMotion>
        </circle>
      </svg>
      <span class="nf-chip">404</span>
    </div>
  </div>

  <h1 class="nf-title"><span>This page took</span> <span>a wrong turn.</span></h1>
  <p class="nf-lede">The link may be old or mistyped. These paths lead somewhere.</p>
  <div class="hero-actions nf-actions">
    <a class="btn btn-primary" href="/">Go to the home page</a>
    <a class="btn btn-secondary" href="/works">See all work</a>
  </div>
</main>
