<!-- ============ TALK TO MY WORK PANEL (same as the home page). The case study's
     "Ask AI about this project" buttons open it and ask about this project;
     answers come from the case study content (js/case.js). ============ -->
<aside class="ask-panel" id="askPanel" hidden aria-label="Talk to my Work">
  <div class="ask-panel-inner">
    <div class="ask-panel-head">
      <button class="ask-panel-close" id="askPanelClose" type="button" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M10 2.5h2a2.5 2.5 0 0 1 2.5 2.5v6a2.5 2.5 0 0 1-2.5 2.5h-2v-11Z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="ask-panel-scroll" id="askPanelScroll">
      <p class="ask-panel-lede">Ask about this project, my process, or how to reach me.</p>
      <div class="ask-panel-suggest" id="askPanelSuggest">
        <button class="wk-chip" type="button" data-q="What was the problem?">What was the problem?</button>
        <button class="wk-chip" type="button" data-q="What did you learn?">What did you learn?</button>
        <button class="wk-chip" type="button" data-q="What were the results?">What were the results?</button>
        <button class="wk-chip" type="button" data-q="What was your role?">What was your role?</button>
      </div>
      <div class="ask-panel-thread" id="askPanelThread" role="log" aria-live="polite" aria-label="Conversation"></div>
    </div>
    <form class="ask-panel-form" id="askPanelForm">
      <label class="ag-form-label" for="askPanelInput">Ask a question</label>
      <textarea class="ask-panel-input" id="askPanelInput" rows="2" autocomplete="off" placeholder="Ask something…"></textarea>
      <button class="ask-panel-send" type="submit" aria-label="Send" disabled>
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 11.5v-9M3 6l4-4 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </div>
</aside>
</div>

<!-- ============ PASSWORD DIALOG for locked case studies. A project is locked
     when its card has data-locked. The password is checked in script.js
     (block 11c); see the note there on how to change it. ============ -->
<dialog class="lock-dialog" id="lockDialog" aria-labelledby="lockTitle" aria-describedby="lockDesc">
  <form class="lock-form" id="lockForm" novalidate>
    <span class="lock-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span>
    <h2 id="lockTitle">This case study is password protected</h2>
    <p id="lockDesc">Enter the password to read this case study. Don't have one? Email <a href="mailto:hello@example.com">hello@example.com</a> and I'll share it.</p>
    <label class="lock-label" for="lockInput">Password</label>
    <input class="lock-input" id="lockInput" name="password" type="password" autocomplete="current-password" aria-describedby="lockError">
    <p class="lock-error" id="lockError" role="alert"></p>
    <div class="lock-actions">
      <button class="btn btn-secondary" type="button" id="lockCancel">Cancel</button>
      <button class="btn btn-primary" type="submit">Unlock</button>
    </div>
  </form>
</dialog>

<script src="js/case-data.js" defer></script>

<script src="js/script.js" defer></script>
